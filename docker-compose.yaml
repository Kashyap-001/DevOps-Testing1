
services:
  web:
    build: .
    ports:
      - "8000:8000"  # [Host Port]:[Container Port]
    volumes:
      - .:/app

    
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload